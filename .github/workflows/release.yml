name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: conduit

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        run: cargo test

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_tool: cargo
            smoke_test: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build_tool: cross
            smoke_test: false
          - os: macos-13
            target: x86_64-apple-darwin
            build_tool: cargo
            smoke_test: true
          - os: macos-14
            target: aarch64-apple-darwin
            build_tool: cargo
            smoke_test: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.build_tool == 'cross'
        run: cargo install cross --locked

      - name: Build release binary
        run: |
          if [ "${{ matrix.build_tool }}" = "cross" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Verify built binary exists
        run: test -f "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"

      - name: Smoke test binary
        if: matrix.smoke_test
        run: |
          "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" --help

      - name: Package release archive
        shell: bash
        run: |
          ASSET_NAME="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          PACKAGE_DIR="${ASSET_NAME%.tar.gz}"
          BINARY_PATH="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"

          mkdir -p "${PACKAGE_DIR}"
          cp "${BINARY_PATH}" "${PACKAGE_DIR}/${{ env.BINARY_NAME }}"
          chmod 755 "${PACKAGE_DIR}/${{ env.BINARY_NAME }}"
          cp README.md "${PACKAGE_DIR}/README.md"

          tar -czf "${ASSET_NAME}" "${PACKAGE_DIR}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.tar.gz
